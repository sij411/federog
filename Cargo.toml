[package]
name = "federog"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
ammonia = "4.1.3"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
feder-core = { git = "https://github.com/sij411/feder.git", rev = "056c2cd063fa42159949c4884e77410fc40f379a" }
feder-server = { git = "https://github.com/sij411/feder.git", rev = "056c2cd063fa42159949c4884e77410fc40f379a" }
feder-vocab = { git = "https://github.com/sij411/feder.git", rev = "056c2cd063fa42159949c4884e77410fc40f379a" }
html-escape = "0.2"
anyhow = "1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
